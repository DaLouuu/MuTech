services:
  backend:
    build:
      context: ./mvp
      dockerfile: Dockerfile
    container_name: mutech-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - MF0_REPO=/app/multif0-estimation-polyvocals
    restart: unless-stopped

  frontend:
    build:
      context: ./mvp/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: mutech-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
